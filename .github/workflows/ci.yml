name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main, "feature/**", "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: creator_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run server tests
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/creator_platform_test
          JWT_SECRET: testsecret
        run: |
          cd server
          npm test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/creator_platform_test
          JWT_SECRET: test-jwt-secret-key-12345

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Run client tests
        run: |
          cd client
          npm test
